<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="physGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="45%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadowPhys" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#physGrad)" />

  <!-- Atomic and Circuit Vectors -->
  <g opacity="0.12" stroke="#38bdf8" fill="none" stroke-width="2">
    <ellipse cx="480" cy="220" rx="140" ry="50" transform="rotate(-30 480 220)" />
    <ellipse cx="480" cy="220" rx="140" ry="50" transform="rotate(30 480 220)" />
    <ellipse cx="480" cy="220" rx="140" ry="50" transform="rotate(90 480 220)" />
    <circle cx="480" cy="220" r="14" fill="#38bdf8" />
    
    <!-- Circuit Waves -->
    <path d="M 60 650 L 140 650 L 160 620 L 180 680 L 200 620 L 220 680 L 240 650 L 320 650" />
    <circle cx="100" cy="200" r="80" />
    <circle cx="100" cy="200" r="40" />
  </g>

  <g opacity="0.1" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="bold">
    <text x="60" y="280">u_c(t) + RC · du_c/dt = E</text>
    <text x="360" y="580">N(t) = N₀ · e^(-λt)</text>
    <text x="80" y="520">Σ F_ext = m · a_G</text>
  </g>

  <!-- Book Spine Visual Edge -->
  <rect x="0" y="0" width="28" height="800" fill="#000000" opacity="0.25" />
  <line x1="28" y1="0" x2="28" y2="800" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />

  <!-- Outer Border Frame -->
  <rect x="42" y="36" width="516" height="728" rx="16" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2" />
  <rect x="48" y="42" width="504" height="716" rx="12" fill="none" stroke="url(#cyanGrad)" stroke-opacity="0.6" stroke-width="1.5" />

  <!-- Top Badge -->
  <g filter="url(#shadowPhys)">
    <rect x="150" y="70" width="300" height="42" rx="21" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
    <text x="300" y="97" font-family="Cairo, Tahoma, Arial, sans-serif" font-size="16" font-weight="bold" fill="#93c5fd" text-anchor="middle">
      سلسلة التفوق والامتياز
    </text>
  </g>

  <!-- Subject Pill -->
  <text x="300" y="165" font-family="Cairo, Tahoma, Arial, sans-serif" font-size="22" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
    العلوم الفيزيائية • 3 ثـانـوي
  </text>

  <!-- Main Title Container -->
  <g filter="url(#shadowPhys)">
    <text x="300" y="260" font-family="Cairo, Tahoma, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">
      سلسلة المجتهد
    </text>
    <text x="300" y="315" font-family="Cairo, Tahoma, Arial, sans-serif" font-size="26" font-weight="bold" fill="#bae6fd" text-anchor="middle">
      طريقك إلى البكالوريا في الفيزياء
    </text>
  </g>

  <!-- Module Subtitle Box -->
  <rect x="90" y="360" width="420" height="110" rx="16" fill="#000000" fill-opacity="0.35" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
  <text x="300" y="405" font-family="Cairo, Tahoma, Arial, sans-serif" font-size="23" font-weight="bold" fill="#fde047" text-anchor="middle">
    الوحدات الأساسية والمسائل الشاملة
  </text>
  <text x="300" y="445" font-family="Cairo, Tahoma, Arial, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">
    المتابعة الزمنية • التحولات النووية • الظواهر الكهربائية
  </text>

  <!-- Feature Points -->
  <g font-family="Cairo, Tahoma, Arial, sans-serif" font-size="15" fill="#cbd5e1" font-weight="600">
    <circle cx="130" cy="520" r="5" fill="#38bdf8" />
    <text x="150" y="525" text-anchor="start">ملخصات دقيقة للقوانين والوحدات الدولية</text>

    <circle cx="130" cy="560" r="5" fill="#38bdf8" />
    <text x="150" y="565" text-anchor="start">شرح استخراج البيانات ونقاط التكافؤ من المنحنيات</text>

    <circle cx="130" cy="600" r="5" fill="#38bdf8" />
    <text x="150" y="605" text-anchor="start">نماذج تمارين وتمارين نموذجية بحلول منهجية مفصلة</text>
  </g>

  <!-- Bottom Target Streams Banner -->
  <rect x="70" y="660" width="460" height="42" rx="10" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1" />
  <text x="300" y="687" font-family="Cairo, Tahoma, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    علوم تجريبية • تقني رياضي • رياضيات
  </text>

  <!-- Author Tag -->
  <text x="300" y="735" font-family="Cairo, Tahoma, Arial, sans-serif" font-size="13" font-weight="bold" fill="#94a3b8" text-anchor="middle">
    إعداد: نخبة من أساتذة ومفتشي مادة العلوم الفيزيائية
  </text>
</svg>
