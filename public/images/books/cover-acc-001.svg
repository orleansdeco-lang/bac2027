<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="accGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="45%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanAccGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow_accGrad" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#accGrad)" />

  <!-- Background Vector Elements -->
  <g opacity="0.08" stroke="#ffffff" fill="none" stroke-width="2">
    <circle cx="500" cy="180" r="140" />
    <circle cx="500" cy="180" r="90" />
    <circle cx="100" cy="650" r="120" />
    <path d="M 50 120 Q 250 20 450 150 T 580 140" />
    <path d="M 60 720 Q 260 580 440 730 T 560 660" />
  </g>

  <!-- Book Spine Visual Edge -->
  <rect x="0" y="0" width="28" height="800" fill="#000000" opacity="0.28" />
  <line x1="28" y1="0" x2="28" y2="800" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />

  <!-- Outer Border Frame -->
  <rect x="42" y="36" width="516" height="728" rx="16" fill="none" stroke="#06b6d4" stroke-opacity="0.35" stroke-width="2" />
  <rect x="48" y="42" width="504" height="716" rx="12" fill="none" stroke="url(#cyanAccGrad)" stroke-opacity="0.6" stroke-width="1.5" />

  <!-- Top Badge -->
  <g filter="url(#shadow_accGrad)">
    <rect x="130" y="70" width="340" height="42" rx="21" fill="#075985" stroke="#38bdf8" stroke-width="1.5" />
    <text x="300" y="97" font-family="Cairo, Tahoma, Arial, sans-serif" font-size="16" font-weight="bold" fill="#bae6fd" text-anchor="middle">
      سلسلة التميز في التسيير والاقتصاد
    </text>
  </g>

  <!-- Subject Pill -->
  <text x="300" y="165" font-family="Cairo, Tahoma, Arial, sans-serif" font-size="22" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
    الـتـسـيـيـر الـمـالـي والـمـحـاسـبـي • 3 ثـانـوي
  </text>

  <!-- Main Title Container -->
  <g filter="url(#shadow_accGrad)">
    <text x="300" y="250" font-family="Cairo, Tahoma, Arial, sans-serif" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">
      ملخص التسيير المحاسبي والمالي
    </text>
    <text x="300" y="300" font-family="Cairo, Tahoma, Arial, sans-serif" font-size="20" font-weight="bold" fill="#e2e8f0" text-anchor="middle">
      أعمال نهاية السنة، التسويات، وإعداد القوائم المالية
    </text>
  </g>

  <!-- Module Subtitle Box -->
  <rect x="80" y="340" width="440" height="110" rx="16" fill="#000000" fill-opacity="0.35" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
  <text x="300" y="382" font-family="Cairo, Tahoma, Arial, sans-serif" font-size="21" font-weight="bold" fill="#38bdf8" text-anchor="middle">
    الاهتلاكات ونقص القيمة • تسوية المخزونات وحسابات النتائج
  </text>
  <text x="300" y="420" font-family="Cairo, Tahoma, Arial, sans-serif" font-size="15" font-weight="600" fill="#f1f5f9" text-anchor="middle">
    مؤشرات التسيير • قدرة التمويل الذاتي CAF • اختيار المشاريع الاستثمارية
  </text>

  <!-- Feature Points -->
  <g font-family="Cairo, Tahoma, Arial, sans-serif" font-size="14.5" fill="#cbd5e1" font-weight="600">
    <circle cx="120" cy="500" r="5" fill="#06b6d4" />
    <text x="140" y="505" text-anchor="start">ملخص شامل لجميع قيود اليومية وفق النظام المحاسبي المالي SCF</text>

    <circle cx="120" cy="540" r="5" fill="#06b6d4" />
    <text x="140" y="545" text-anchor="start">جداول الاهتلاك الخطي والمتناقص والمتزايد مع قيود التسوية السنوية</text>

    <circle cx="120" cy="580" r="5" fill="#06b6d4" />
    <text x="140" y="585" text-anchor="start">تمارين تطبيقية نموذجية محلولة مع حساب الفوارق والنسب المالية</text>
  </g>

  <!-- Bottom Target Streams Banner -->
  <rect x="70" y="640" width="460" height="40" rx="10" fill="#000000" fill-opacity="0.4" stroke="#06b6d4" stroke-opacity="0.5" stroke-width="1" />
  <text x="300" y="665" font-family="Cairo, Tahoma, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    شعبة تسيير واقتصاد - الثالثة ثانوي
  </text>

  <!-- Footer Author -->
  <text x="300" y="730" font-family="Cairo, Tahoma, Arial, sans-serif" font-size="14" font-weight="bold" fill="#94a3b8" text-anchor="middle">
    إعداد: الأستاذ إلياس بن خديجة / مفتش التعليم الثانوي
  </text>
</svg>