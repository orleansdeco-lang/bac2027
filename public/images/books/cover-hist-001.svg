<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="histGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="45%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <linearGradient id="goldHistGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <filter id="shadowHist" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#histGrad)" />

  <!-- World Globe Grid Background Motif -->
  <g opacity="0.12" stroke="#fde047" fill="none" stroke-width="2">
    <circle cx="480" cy="220" r="140" />
    <ellipse cx="480" cy="220" rx="140" ry="60" />
    <ellipse cx="480" cy="220" rx="140" ry="110" />
    <line x1="340" y1="220" x2="620" y2="220" />
    <line x1="480" y1="80" x2="480" y2="360" />
    
    <!-- Map Pin & Timeline markers -->
    <path d="M 120 620 L 480 620" />
    <circle cx="160" cy="620" r="7" fill="#fde047" />
    <circle cx="280" cy="620" r="7" fill="#fde047" />
    <circle cx="400" cy="620" r="7" fill="#fde047" />
  </g>

  <g opacity="0.1" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">
    <text x="60" y="270">1945 - 1989: الحرب الباردة</text>
    <text x="320" y="560">1954 - 1962: الثورة التحريرية</text>
    <text x="70" y="510">العالم المتقدم والعالم المتخلف</text>
  </g>

  <!-- Book Spine Visual Edge -->
  <rect x="0" y="0" width="28" height="800" fill="#000000" opacity="0.25" />
  <line x1="28" y1="0" x2="28" y2="800" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />

  <!-- Outer Border Frame -->
  <rect x="42" y="36" width="516" height="728" rx="16" fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="2" />
  <rect x="48" y="42" width="504" height="716" rx="12" fill="none" stroke="url(#goldHistGrad)" stroke-opacity="0.6" stroke-width="1.5" />

  <!-- Top Badge -->
  <g filter="url(#shadowHist)">
    <rect x="130" y="70" width="340" height="42" rx="21" fill="#78350f" stroke="#fbbf24" stroke-width="1.5" />
    <text x="300" y="97" font-family="Cairo, Tahoma, Arial, sans-serif" font-size="16" font-weight="bold" fill="#fef08a" text-anchor="middle">
      المرجع الذهبي الشامل لجميع الشعب
    </text>
  </g>

  <!-- Subject Pill -->
  <text x="300" y="165" font-family="Cairo, Tahoma, Arial, sans-serif" font-size="22" font-weight="900" fill="#fbbf24" text-anchor="middle" letter-spacing="1">
    التـاريـخ والـجـغـرافـيـا • 3 ثـانـوي
  </text>

  <!-- Main Title Container -->
  <g filter="url(#shadowHist)">
    <text x="300" y="250" font-family="Cairo, Tahoma, Arial, sans-serif" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle">
      كتاب الأستاذ محمودي عادل
    </text>
    <text x="300" y="305" font-family="Cairo, Tahoma, Arial, sans-serif" font-size="24" font-weight="bold" fill="#fed7aa" text-anchor="middle">
      دليل التفوق في مادة الاجتماعيات
    </text>
  </g>

  <!-- Module Subtitle Box -->
  <rect x="70" y="350" width="460" height="120" rx="16" fill="#000000" fill-opacity="0.4" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5" />
  <text x="300" y="395" font-family="Cairo, Tahoma, Arial, sans-serif" font-size="21" font-weight="bold" fill="#fde047" text-anchor="middle">
    المصطلحات • الشخصيات • التواريخ المعلمية
  </text>
  <text x="300" y="430" font-family="Cairo, Tahoma, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffedd5" text-anchor="middle">
    خرائط التوقيع الصماء • منهجية كتابة المقال التاريخي والجغرافي
  </text>
  <text x="300" y="455" font-family="Cairo, Tahoma, Arial, sans-serif" font-size="13" font-weight="500" fill="#fed7aa" text-anchor="middle">
    طبعة شاملة ومحدثة وفق التدرجات البيداغوجية الرسمية
  </text>

  <!-- Feature Points -->
  <g font-family="Cairo, Tahoma, Arial, sans-serif" font-size="15" fill="#cbd5e1" font-weight="600">
    <circle cx="120" cy="515" r="5" fill="#fbbf24" />
    <text x="140" y="520" text-anchor="start">تعريفات مبسطة ودقيقة للشخصيات مع الجنسية والمنصب وأهم عمل</text>

    <circle cx="120" cy="555" r="5" fill="#fbbf24" />
    <text x="140" y="560" text-anchor="start">شرح دقيق للمصطلحات الاقتصادية والسياسية مع الكلمات المفتاحية</text>

    <circle cx="120" cy="595" r="5" fill="#fbbf24" />
    <text x="140" y="600" text-anchor="start">خرائط توقيع جاهزة ومخططات ذكية لتثبيت الحفظ والاسترجاع السريع</text>
  </g>

  <!-- Bottom Target Streams Banner -->
  <rect x="60" y="660" width="480" height="42" rx="10" fill="#78350f" stroke="#f59e0b" stroke-width="1" />
  <text x="300" y="687" font-family="Cairo, Tahoma, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    شامل لجميع الشعب: علوم • رياضيات • تقني • تسيير • آداب • لغات
  </text>

  <!-- Author Tag -->
  <text x="300" y="735" font-family="Cairo, Tahoma, Arial, sans-serif" font-size="14" font-weight="bold" fill="#fed7aa" text-anchor="middle">
    تأليف وإعداد: الأستاذ محمودي عادل
  </text>
</svg>
