<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" dir="rtl">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="largeSubunit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="smallSubunit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="trnaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="520" rx="16" fill="#ffffff"/>
  <rect x="15" y="15" width="870" height="490" rx="12" fill="url(#bg5)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Title Banner -->
  <rect x="35" y="30" width="830" height="40" rx="8" fill="#0f172a"/>
  <text x="450" y="55" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    رسم تخطيطي لبنية الريبوزوم الوظيفي ومرحلة الاستطالة في الترجمة (تشكل الرابطة الببتيدية)
  </text>

  <!-- mRNA Strand passing through ribosome -->
  <path d="M 60 360 L 840 360" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
  <!-- Codons on mRNA -->
  <g font-size="12" font-weight="bold" font-family="monospace" text-anchor="middle" fill="#991b1b">
    <rect x="70" y="350" width="30" height="20" rx="3" fill="#fee2e2"/>
    <text x="85" y="365">5'</text>
    <text x="220" y="380">AUG</text>
    <text x="320" y="380">UUC</text>
    <!-- At P Site -->
    <rect x="385" y="368" width="60" height="18" rx="4" fill="#fecaca"/>
    <text x="415" y="382">GAG</text>
    <!-- At A Site -->
    <rect x="485" y="368" width="60" height="18" rx="4" fill="#fed7aa"/>
    <text x="515" y="382">UAC</text>
    <text x="610" y="380">CUA</text>
    <text x="700" y="380">UAA</text>
    <rect x="800" y="350" width="30" height="20" rx="3" fill="#fee2e2"/>
    <text x="815" y="365">3'</text>
  </g>
  <text x="740" y="340" fill="#dc2626" font-size="12" font-weight="bold">خيط الـ ARNm</text>

  <!-- Small Ribosomal Subunit (1) -->
  <path d="M 280 395 C 280 375, 660 375, 660 395 C 660 445, 590 465, 470 465 C 350 465, 280 445, 280 395 Z" 
        fill="url(#smallSubunit)" stroke="#d97706" stroke-width="3" filter="url(#shadow5)"/>
  <text x="470" y="445" fill="#78350f" font-size="13" font-weight="bold" text-anchor="middle">تحت وحدة ريبوزومية صغرى (40S / 30S)</text>

  <!-- Large Ribosomal Subunit (2) with P and A site pockets -->
  <path d="M 250 345 C 250 160, 420 120, 470 120 C 520 120, 690 160, 690 345 C 620 350, 560 330, 470 330 C 380 330, 320 350, 250 345 Z" 
        fill="url(#largeSubunit)" stroke="#4338ca" stroke-width="3.5" filter="url(#shadow5)"/>
  <text x="470" y="150" fill="#312e81" font-size="14" font-weight="bold" text-anchor="middle">تحت وحدة ريبوزومية كبرى (60S / 50S)</text>

  <!-- P Site Cavity (3) -->
  <rect x="385" y="240" width="60" height="100" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,3" opacity="0.6"/>
  <text x="415" y="325" fill="#4338ca" font-size="16" font-weight="bold" text-anchor="middle">P</text>

  <!-- A Site Cavity (4) -->
  <rect x="485" y="240" width="60" height="100" rx="8" fill="#ffffff" stroke="#f97316" stroke-width="2" stroke-dasharray="4,3" opacity="0.6"/>
  <text x="515" y="325" fill="#c2410c" font-size="16" font-weight="bold" text-anchor="middle">A</text>

  <!-- tRNA at P Site (Carrying Dipeptide/Growing Chain) -->
  <g transform="translate(405, 230)">
    <!-- Cloverleaf simplified body -->
    <path d="M 10 90 L 10 50 C -10 40, -10 20, 10 15 C 10 -5, 10 -5, 10 -20" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
    <!-- Anticodon -->
    <text x="10" y="110" font-size="11" font-weight="bold" font-family="monospace" fill="#065f46" text-anchor="middle">CUC</text>
  </g>

  <!-- tRNA at A Site (5) (Carrying incoming amino acid) -->
  <g transform="translate(505, 230)">
    <path d="M 10 90 L 10 50 C -10 40, -10 20, 10 15 C 10 -5, 10 -5, 10 -20" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <text x="10" y="110" font-size="11" font-weight="bold" font-family="monospace" fill="#047857" text-anchor="middle">AUG</text>
  </g>

  <!-- Polypeptide Chain Growing from P Site tRNA (6) -->
  <g id="polypeptideChain">
    <!-- Peptide link formation -->
    <line x1="415" y1="210" x2="515" y2="210" stroke="#f59e0b" stroke-width="3" stroke-dasharray="2,2"/>
    <!-- Amino acids in chain -->
    <circle cx="415" cy="195" r="12" fill="#10b981" stroke="#047857" stroke-width="2"/>
    <text x="415" y="199" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">Glu</text>

    <circle cx="395" cy="165" r="12" fill="#10b981" stroke="#047857" stroke-width="2"/>
    <text x="395" y="169" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">Phe</text>

    <circle cx="365" cy="145" r="12" fill="#10b981" stroke="#047857" stroke-width="2"/>
    <text x="365" y="149" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">Met</text>

    <!-- Peptide bonds -->
    <line x1="415" y1="183" x2="395" y2="177" stroke="#059669" stroke-width="3"/>
    <line x1="395" y1="153" x2="365" y2="157" stroke="#059669" stroke-width="3"/>

    <!-- New Amino Acid at A site -->
    <circle cx="515" cy="195" r="12" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
    <text x="515" y="199" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">Tyr</text>
  </g>

  <!-- Exit Site (E) indication -->
  <rect x="305" y="250" width="50" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="330" y="290" fill="#64748b" font-size="14" font-weight="bold" text-anchor="middle">E</text>

  <!-- Ribosome Movement Arrow -->
  <g transform="translate(680, 430)">
    <rect x="-80" y="-12" width="160" height="24" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="0" y="4" fill="#065f46" font-size="10" font-weight="bold" text-anchor="middle">انتقال الريبوزوم ➔ بمقدار رامزة</text>
  </g>

  <!-- ================= NUMBER CALLOUTS ================= -->
  <!-- 1: Small Subunit -->
  <circle cx="230" cy="425" r="14" fill="#d97706"/>
  <text x="230" y="430" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">1</text>
  <text x="210" y="455" fill="#92400e" font-size="12" font-weight="bold" text-anchor="middle">1. تحت وحدة صغرى</text>

  <!-- 2: Large Subunit -->
  <circle cx="210" cy="180" r="14" fill="#4338ca"/>
  <text x="210" y="185" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">2</text>
  <text x="200" y="205" fill="#312e81" font-size="12" font-weight="bold" text-anchor="middle">2. تحت وحدة كبرى</text>

  <!-- 3: P Site -->
  <circle cx="415" cy="270" r="14" fill="#6366f1"/>
  <text x="415" y="275" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">3</text>
  <text x="415" y="255" fill="#312e81" font-size="11" font-weight="bold" text-anchor="middle">3. موقع P ببتيدي</text>

  <!-- 4: A Site -->
  <circle cx="515" cy="270" r="14" fill="#f97316"/>
  <text x="515" y="275" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">4</text>
  <text x="515" y="255" fill="#9a3412" font-size="11" font-weight="bold" text-anchor="middle">4. موقع A أميني</text>

  <!-- 5: tRNA -->
  <circle cx="590" cy="225" r="14" fill="#059669"/>
  <text x="590" y="230" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">5</text>
  <text x="660" y="230" fill="#065f46" font-size="12" font-weight="bold">5. جزيء ARNt نوعي</text>

  <!-- 6: Polypeptide Chain -->
  <circle cx="310" cy="120" r="14" fill="#10b981"/>
  <text x="310" y="125" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">6</text>
  <text x="290" y="100" fill="#047857" font-size="12" font-weight="bold">6. سلسلة ببتيدية نامية</text>
</svg>