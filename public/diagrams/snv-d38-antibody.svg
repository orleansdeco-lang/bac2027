<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" dir="rtl">
  <defs>
    <linearGradient id="bg38" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="heavyChain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="lightChain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="varRegion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow38" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="520" rx="16" fill="#ffffff"/>
  <rect x="15" y="15" width="870" height="490" rx="12" fill="url(#bg38)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Title Banner -->
  <rect x="35" y="30" width="830" height="40" rx="8" fill="#0f172a"/>
  <text x="450" y="55" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    رسم تخطيطي تفصيلي للبنية الجزيئية للجسم المضاد النوعي من نمط الغلوبولينات المناعية (IgG)
  </text>

  <!-- Left Arm (Fab Left) -->
  <g transform="rotate(-30 400 240)">
    <!-- Light Chain Left: VL + CL (2) -->
    <!-- VL (Variable) (3) -->
    <rect x="250" y="80" width="36" height="60" rx="10" fill="url(#varRegion)" filter="url(#shadow38)"/>
    <text x="268" y="115" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">VL</text>
    <!-- CL (Constant) -->
    <rect x="250" y="145" width="36" height="60" rx="10" fill="url(#lightChain)" filter="url(#shadow38)"/>
    <text x="268" y="180" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">CL</text>

    <!-- Heavy Chain Left: VH + CH1 (1) -->
    <!-- VH (Variable) (3) -->
    <rect x="295" y="80" width="36" height="60" rx="10" fill="url(#varRegion)" filter="url(#shadow38)"/>
    <text x="313" y="115" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">VH</text>
    <!-- CH1 -->
    <rect x="295" y="145" width="36" height="60" rx="10" fill="url(#heavyChain)" filter="url(#shadow38)"/>
    <text x="313" y="180" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">CH1</text>

    <!-- S-S between H and L (5) -->
    <line x1="286" y1="175" x2="295" y2="175" stroke="#ef4444" stroke-width="4"/>

    <!-- Antigen Binding Site Left (Fab tip) -->
    <path d="M 255 78 C 265 65, 298 65, 308 78" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="3,2"/>
  </g>

  <!-- Right Arm (Fab Right) -->
  <g transform="rotate(30 500 240)">
    <!-- Heavy Chain Right: VH + CH1 (1) -->
    <!-- VH (Variable) (3) -->
    <rect x="570" y="80" width="36" height="60" rx="10" fill="url(#varRegion)" filter="url(#shadow38)"/>
    <text x="588" y="115" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">VH</text>
    <!-- CH1 -->
    <rect x="570" y="145" width="36" height="60" rx="10" fill="url(#heavyChain)" filter="url(#shadow38)"/>
    <text x="588" y="180" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">CH1</text>

    <!-- Light Chain Right: VL + CL (2) -->
    <!-- VL (Variable) (3) -->
    <rect x="615" y="80" width="36" height="60" rx="10" fill="url(#varRegion)" filter="url(#shadow38)"/>
    <text x="633" y="115" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">VL</text>
    <!-- CL -->
    <rect x="615" y="145" width="36" height="60" rx="10" fill="url(#lightChain)" filter="url(#shadow38)"/>
    <text x="633" y="180" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">CL</text>

    <!-- S-S between H and L (5) -->
    <line x1="606" y1="175" x2="615" y2="175" stroke="#ef4444" stroke-width="4"/>

    <!-- Antigen Binding Site Right (Fab tip) -->
    <path d="M 593 78 C 603 65, 630 65, 640 78" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="3,2"/>
  </g>

  <!-- Flexible Hinge Region (6) -->
  <g id="hingeRegion">
    <path d="M 425 240 Q 420 260, 430 270" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
    <path d="M 475 240 Q 480 260, 470 270" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
    <!-- Interchain Disulfide Bridges (S-S) at hinge (5) -->
    <line x1="428" y1="250" x2="472" y2="250" stroke="#ef4444" stroke-width="4"/>
    <line x1="430" y1="260" x2="470" y2="260" stroke="#ef4444" stroke-width="4"/>
    <text x="450" y="244" fill="#dc2626" font-size="10" font-weight="bold" text-anchor="middle">-S-S-</text>
  </g>

  <!-- Stem of Y: Fc Region (4) -->
  <g id="fcStem">
    <!-- CH2 Left & Right -->
    <rect x="410" y="275" width="36" height="60" rx="10" fill="url(#heavyChain)" filter="url(#shadow38)"/>
    <text x="428" y="310" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">CH2</text>

    <rect x="454" y="275" width="36" height="60" rx="10" fill="url(#heavyChain)" filter="url(#shadow38)"/>
    <text x="472" y="310" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">CH2</text>

    <!-- Carbohydrate / Glycosylation between CH2 -->
    <circle cx="450" cy="305" r="7" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>

    <!-- CH3 Left & Right -->
    <rect x="410" y="342" width="36" height="60" rx="10" fill="url(#heavyChain)" filter="url(#shadow38)"/>
    <text x="428" y="377" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">CH3</text>

    <rect x="454" y="342" width="36" height="60" rx="10" fill="url(#heavyChain)" filter="url(#shadow38)"/>
    <text x="472" y="377" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">CH3</text>

    <!-- C-Terminal ends -->
    <text x="428" y="420" fill="#1e3a8a" font-size="11" font-weight="bold" text-anchor="middle">-COOH</text>
    <text x="472" y="420" fill="#1e3a8a" font-size="11" font-weight="bold" text-anchor="middle">-COOH</text>
  </g>

  <!-- Large structural labels on sides -->
  <!-- Left Fab region bracket -->
  <path d="M 170 120 L 160 120 L 160 210 L 150 210 L 160 210 L 160 300 L 170 300" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="140" y="215" fill="#475569" font-size="14" font-weight="bold" text-anchor="end">منطقة متغيرة Fab (تثبيت المستضد)</text>

  <!-- Right Fc region bracket -->
  <path d="M 520 275 L 530 275 L 530 340 L 540 340 L 530 340 L 530 405 L 520 405" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="555" y="345" fill="#475569" font-size="14" font-weight="bold">منطقة ثابتة Fc (تثبيت على البالعات و C')</text>

  <!-- ================= NUMBER CALLOUTS ================= -->
  <!-- 1: Heavy Chain -->
  <circle cx="370" cy="180" r="14" fill="#2563eb"/>
  <text x="370" y="185" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">1</text>
  <text x="370" y="160" fill="#1e40af" font-size="11" font-weight="bold" text-anchor="middle">1. سلسلة ثقيلة H</text>

  <!-- 2: Light Chain -->
  <circle cx="210" cy="190" r="14" fill="#059669"/>
  <text x="210" y="195" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">2</text>
  <text x="210" y="215" fill="#065f46" font-size="11" font-weight="bold" text-anchor="middle">2. سلسلة خفيفة L</text>

  <!-- 3: Antigen Binding Site (Fab) -->
  <circle cx="285" cy="45" r="14" fill="#d97706"/>
  <text x="285" y="50" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">3</text>
  <text x="285" y="25" fill="#92400e" font-size="11" font-weight="bold" text-anchor="middle">3. موقع تثبيت محدد المستضد (Fab)</text>

  <!-- 4: Constant Fc region -->
  <circle cx="450" cy="450" r="14" fill="#475569"/>
  <text x="450" y="455" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">4</text>
  <text x="450" y="475" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">4. المنطقة الثابتة المتبلورة (Fc)</text>

  <!-- 5: Disulfide bridges -->
  <circle cx="450" cy="225" r="14" fill="#dc2626"/>
  <text x="450" y="230" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">5</text>
  <text x="450" y="210" fill="#991b1b" font-size="11" font-weight="bold" text-anchor="middle">5. جسور ثنائية الكبريت (-S-S-)</text>

  <!-- 6: Hinge Region -->
  <circle cx="390" cy="250" r="14" fill="#8b5cf6"/>
  <text x="390" y="255" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">6</text>
  <text x="345" y="270" fill="#6d28d9" font-size="11" font-weight="bold">6. منطقة مفصلية</text>
</svg>