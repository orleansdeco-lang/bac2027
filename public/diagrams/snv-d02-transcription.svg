<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" dir="rtl">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="polGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="900" height="520" rx="16" fill="#ffffff"/>
  <rect x="15" y="15" width="870" height="490" rx="12" fill="url(#bg2)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Title Banner -->
  <rect x="35" y="30" width="830" height="40" rx="8" fill="#0f172a"/>
  <text x="450" y="55" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    رسم تخطيطي تفسيري لآلية الاستنساخ الحيوي وتدخل إنزيم ARN بوليميراز
  </text>

  <!-- Direction of Transcription Arrow -->
  <g transform="translate(450, 95)">
    <rect x="-120" y="-12" width="240" height="24" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="0" y="4" fill="#065f46" font-size="11" font-weight="bold" text-anchor="middle">اتجاه الاستنساخ وحركة الإنزيم ➔</text>
  </g>

  <!-- DNA Strands outside bubble (Double Helix on left & right) -->
  <!-- Left Double Strand (Unopened DNA upstream) -->
  <path d="M 60 210 L 220 210" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/>
  <path d="M 60 270 L 220 270" stroke="#0369a1" stroke-width="5" stroke-linecap="round"/>
  <!-- Hydrogen bonds upstream -->
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="80" y1="210" x2="80" y2="270"/>
    <line x1="110" y1="210" x2="110" y2="270"/>
    <line x1="140" y1="210" x2="140" y2="270"/>
    <line x1="170" y1="210" x2="170" y2="270"/>
    <line x1="200" y1="210" x2="200" y2="270"/>
  </g>

  <!-- Right Double Strand (Rewound DNA downstream) -->
  <path d="M 680 210 L 840 210" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/>
  <path d="M 680 270 L 840 270" stroke="#0369a1" stroke-width="5" stroke-linecap="round"/>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="700" y1="210" x2="700" y2="270"/>
    <line x1="730" y1="210" x2="730" y2="270"/>
    <line x1="760" y1="210" x2="760" y2="270"/>
    <line x1="790" y1="210" x2="790" y2="270"/>
    <line x1="820" y1="210" x2="820" y2="270"/>
  </g>

  <!-- RNA Polymerase Globular Protein (1) -->
  <ellipse cx="450" cy="240" rx="220" ry="140" fill="url(#polGrad)" opacity="0.18" filter="url(#shadow2)"/>
  <ellipse cx="450" cy="240" rx="210" ry="130" fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="8,6"/>
  <text x="450" y="135" fill="#1e40af" font-size="14" font-weight="bold" text-anchor="middle">إنزيم ARN بوليميراز (RNA Polymerase)</text>

  <!-- Transcription Bubble Strands -->
  <!-- Non-transcribed Strand (Coding Strand) 5' -> 3' (3) -->
  <path d="M 220 210 C 270 170, 630 170, 680 210" fill="none" stroke="#0284c7" stroke-width="5"/>
  <!-- Strand polarity tags -->
  <rect x="50" y="196" width="30" height="24" rx="4" fill="#0284c7"/>
  <text x="65" y="212" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">5'</text>
  <rect x="820" y="196" width="30" height="24" rx="4" fill="#0284c7"/>
  <text x="835" y="212" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">3'</text>

  <!-- Transcribed Strand (Template Strand) 3' -> 5' (2) -->
  <path d="M 220 270 C 270 320, 630 320, 680 270" fill="none" stroke="#0369a1" stroke-width="5"/>
  <rect x="50" y="258" width="30" height="24" rx="4" fill="#0369a1"/>
  <text x="65" y="274" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">3'</text>
  <rect x="820" y="258" width="30" height="24" rx="4" fill="#0369a1"/>
  <text x="835" y="274" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">5'</text>

  <!-- Bases on Template Strand (A, T, C, G) -->
  <g font-size="12" font-weight="bold" font-family="monospace" text-anchor="middle" fill="#0369a1">
    <text x="310" y="300">3' TAC</text>
    <text x="370" y="312">CGG</text>
    <text x="430" y="318">AAT</text>
    <text x="490" y="318">GCT</text>
    <text x="550" y="312">ATC 5'</text>
  </g>

  <!-- Growing mRNA Strand 5' -> 3' (4) -->
  <path d="M 550 285 C 470 285, 410 285, 340 270 C 300 255, 270 350, 240 400" 
        fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <!-- Bases on mRNA complementary to Template -->
  <g font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle" fill="#b91c1c">
    <text x="370" y="280">GCC</text>
    <text x="430" y="280">UUA</text>
    <text x="490" y="280">CGA</text>
    <text x="545" y="280">UAG</text>
  </g>
  <!-- mRNA 5' cap -->
  <circle cx="238" cy="405" r="9" fill="#dc2626"/>
  <text x="238" y="409" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">5'</text>
  <text x="565" y="288" fill="#dc2626" font-size="11" font-weight="bold">3'</text>

  <!-- Free Ribonucleotides entering active site (5) -->
  <g transform="translate(560, 370)">
    <circle cx="0" cy="0" r="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="0" y="4" font-size="10" font-weight="bold" fill="#b45309" text-anchor="middle">ATP</text>
    <circle cx="38" cy="-8" r="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="38" y="-4" font-size="10" font-weight="bold" fill="#047857" text-anchor="middle">UTP</text>
    <circle cx="25" cy="24" r="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="25" y="28" font-size="10" font-weight="bold" fill="#6d28d9" text-anchor="middle">CTP</text>
    <circle cx="65" cy="12" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="65" y="16" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">GTP</text>
    <!-- Arrow into enzyme -->
    <path d="M 0 -15 L -40 -45" stroke="#d97706" stroke-width="2.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  </g>

  <!-- ================= NUMBER CALLOUTS ================= -->
  <!-- 1: RNA Polymerase -->
  <circle cx="610" cy="135" r="15" fill="#2563eb"/>
  <text x="610" y="141" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">1</text>
  <text x="635" y="140" fill="#1e40af" font-size="12" font-weight="bold">1. إنزيم ARN بوليميراز</text>

  <!-- 2: Transcribed Strand -->
  <circle cx="450" cy="360" r="15" fill="#0369a1"/>
  <text x="450" y="366" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">2</text>
  <text x="450" y="390" fill="#0369a1" font-size="12" font-weight="bold" text-anchor="middle">2. سلسلة ADN مستنسخة (3' ➔ 5')</text>

  <!-- 3: Non-Transcribed Strand -->
  <circle cx="450" cy="180" r="15" fill="#0284c7"/>
  <text x="450" y="186" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">3</text>
  <text x="450" y="170" fill="#0284c7" font-size="12" font-weight="bold" text-anchor="middle">3. سلسلة ADN غير مستنسخة (5' ➔ 3')</text>

  <!-- 4: mRNA -->
  <circle cx="210" cy="340" r="15" fill="#dc2626"/>
  <text x="210" y="346" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">4</text>
  <text x="210" y="320" fill="#b91c1c" font-size="12" font-weight="bold" text-anchor="middle">4. خيط ARNm النامي (5' ➔ 3')</text>

  <!-- 5: Free Nucleotides -->
  <circle cx="730" cy="410" r="15" fill="#d97706"/>
  <text x="730" y="416" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">5</text>
  <text x="730" y="438" fill="#92400e" font-size="12" font-weight="bold" text-anchor="middle">5. نكليوتيدات ريبية حرة</text>
</svg>