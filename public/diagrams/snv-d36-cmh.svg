<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" dir="rtl">
  <defs>
    <linearGradient id="bg36" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="alphaChain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="betaChain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="b2mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow36" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="520" rx="16" fill="#ffffff"/>
  <rect x="15" y="15" width="870" height="490" rx="12" fill="url(#bg36)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Title Banner -->
  <rect x="35" y="30" width="830" height="40" rx="8" fill="#0f172a"/>
  <text x="450" y="55" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    رسم تخطيطي مقارن للبنية الجزيئية لمعقد التوافق النسيجي الكبير (CMH-I مقابل CMH-II)
  </text>

  <!-- Cell Membrane (Lipid Bilayer at bottom) -->
  <g id="cellMembrane">
    <rect x="35" y="380" width="830" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="850" y="403" fill="#b45309" font-size="11" font-weight="bold">غشاء هيولي</text>
    <text x="450" y="440" fill="#64748b" font-size="12" font-weight="bold" text-anchor="middle">الوسط داخل الخلوي (الهيولى - Cytoplasme)</text>
    <text x="450" y="100" fill="#64748b" font-size="12" font-weight="bold" text-anchor="middle">الوسط خارج الخلوي (Milieu extracellulaire)</text>
  </g>

  <!-- Divider between CMH-I and CMH-II -->
  <line x1="450" y1="80" x2="450" y2="470" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- ================= LEFT PANEL: CMH-I ================= -->
  <g id="cmh1Group" transform="translate(40, 0)">
    <!-- Subtitle -->
    <rect x="100" y="85" width="160" height="28" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="180" y="104" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">جزيئة CMH-I (HLA-I)</text>
    <text x="180" y="125" fill="#64748b" font-size="11" font-weight="bold" text-anchor="middle">(على جميع الخلايا ذات النواة)</text>

    <!-- Peptide Antigen in Groove (3) -->
    <ellipse cx="180" cy="180" rx="35" ry="12" fill="#ef4444" filter="url(#shadow36)"/>
    <text x="180" y="184" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">ببتيد مستضدي</text>

    <!-- Domain Alpha 1 -->
    <rect x="110" y="195" width="65" height="60" rx="16" fill="url(#alphaChain)" filter="url(#shadow36)"/>
    <text x="142" y="232" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">α1</text>

    <!-- Domain Alpha 2 -->
    <rect x="185" y="195" width="65" height="60" rx="16" fill="url(#alphaChain)" filter="url(#shadow36)"/>
    <text x="217" y="232" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">α2</text>

    <!-- Domain Alpha 3 (1) -->
    <rect x="110" y="280" width="65" height="60" rx="16" fill="url(#alphaChain)" filter="url(#shadow36)"/>
    <text x="142" y="317" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">α3</text>

    <!-- Domain Beta-2 Microglobulin (2) -->
    <rect x="185" y="280" width="65" height="60" rx="16" fill="url(#b2mGrad)" filter="url(#shadow36)"/>
    <text x="217" y="317" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">β2m</text>

    <!-- Disulfide bridges (S-S) -->
    <line x1="142" y1="255" x2="142" y2="280" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="217" y1="255" x2="217" y2="280" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="2,2"/>

    <!-- Transmembrane segment of Alpha 3 (4) -->
    <rect x="135" y="340" width="15" height="80" rx="4" fill="#1e3a8a"/>
    <!-- Cytoplasmic tail -->
    <path d="M 142 420 Q 140 450, 160 455" fill="none" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ================= RIGHT PANEL: CMH-II ================= -->
  <g id="cmh2Group" transform="translate(480, 0)">
    <!-- Subtitle -->
    <rect x="110" y="85" width="160" height="28" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="190" y="104" fill="#b45309" font-size="13" font-weight="bold" text-anchor="middle">جزيئة CMH-II (HLA-II)</text>
    <text x="190" y="125" fill="#64748b" font-size="11" font-weight="bold" text-anchor="middle">(على الخلايا العارضة CPA كالبالعات و LB)</text>

    <!-- Peptide Antigen in Open Groove (3) -->
    <ellipse cx="190" cy="180" rx="48" ry="12" fill="#ef4444" filter="url(#shadow36)"/>
    <text x="190" y="184" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">ببتيد مستضدي (مفتوح الطرفين)</text>

    <!-- Domain Alpha 1 -->
    <rect x="120" y="195" width="65" height="60" rx="16" fill="url(#alphaChain)" filter="url(#shadow36)"/>
    <text x="152" y="232" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">α1</text>

    <!-- Domain Beta 1 -->
    <rect x="195" y="195" width="65" height="60" rx="16" fill="url(#betaChain)" filter="url(#shadow36)"/>
    <text x="227" y="232" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">β1</text>

    <!-- Domain Alpha 2 (Transmembrane anchor 1) -->
    <rect x="120" y="280" width="65" height="60" rx="16" fill="url(#alphaChain)" filter="url(#shadow36)"/>
    <text x="152" y="317" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">α2</text>

    <!-- Domain Beta 2 (Transmembrane anchor 2) -->
    <rect x="195" y="280" width="65" height="60" rx="16" fill="url(#betaChain)" filter="url(#shadow36)"/>
    <text x="227" y="317" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">β2</text>

    <!-- Two Transmembrane Segments (4) -->
    <rect x="145" y="340" width="14" height="80" rx="4" fill="#1e3a8a"/>
    <rect x="220" y="340" width="14" height="80" rx="4" fill="#b45309"/>
    <!-- Two Cytoplasmic tails -->
    <path d="M 152 420 Q 150 450, 135 455" fill="none" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/>
    <path d="M 227 420 Q 230 450, 245 455" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ================= NUMBER CALLOUTS ================= -->
  <!-- 1: Alpha Chain -->
  <circle cx="80" cy="240" r="14" fill="#2563eb"/>
  <text x="80" y="245" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">1</text>
  <text x="80" y="220" fill="#1e40af" font-size="11" font-weight="bold" text-anchor="middle">1. سلسلة ثقيلة ألفا</text>

  <!-- 2: Beta 2 Microglobulin -->
  <circle cx="320" cy="310" r="14" fill="#059669"/>
  <text x="320" y="315" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">2</text>
  <text x="320" y="335" fill="#065f46" font-size="11" font-weight="bold" text-anchor="middle">2. سلسلة β2m</text>

  <!-- 3: Peptide Binding Groove -->
  <circle cx="450" cy="180" r="14" fill="#dc2626"/>
  <text x="450" y="185" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">3</text>
  <text x="450" y="160" fill="#991b1b" font-size="11" font-weight="bold" text-anchor="middle">3. حجيرة تثبيت البيبتيد المستضدي</text>

  <!-- 4: Transmembrane segment -->
  <circle cx="80" cy="380" r="14" fill="#1e3a8a"/>
  <text x="80" y="385" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">4</text>
  <text x="80" y="405" fill="#1e3a8a" font-size="11" font-weight="bold" text-anchor="middle">4. جزء غشائي وهيولي</text>
</svg>