<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" dir="rtl">
  <defs>
    <linearGradient id="cellBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="nucleusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="rerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="520" rx="16" fill="#ffffff"/>
  <rect x="15" y="15" width="870" height="490" rx="12" fill="url(#cellBg)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Diagram Title Banner -->
  <rect x="35" y="30" width="830" height="40" rx="8" fill="#0f172a"/>
  <text x="450" y="55" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    رسم تخطيطي لبنية الخلية حقيقية النواة ومقر تركيب البروتين (المستوى الخلوي والجزيئي)
  </text>

  <!-- Plasma Membrane (1) -->
  <path d="M 60 140 C 60 100, 840 100, 840 140 C 860 300, 850 450, 750 470 C 500 500, 300 480, 150 460 C 50 430, 40 280, 60 140 Z" 
        fill="#ffffff" stroke="#059669" stroke-width="5" filter="url(#shadow)"/>
  <path d="M 65 145 C 65 105, 835 105, 835 145 C 853 298, 843 444, 745 464 C 500 493, 303 474, 155 454 C 58 425, 48 281, 65 145 Z" 
        fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Cytoplasm Label -->
  <text x="730" y="160" fill="#64748b" font-size="13" font-weight="bold" font-family="system-ui">الهيولى (Cytoplasme)</text>

  <!-- Nucleus (4) -->
  <ellipse cx="280" cy="270" rx="140" ry="120" fill="url(#nucleusGrad)" stroke="#d97706" stroke-width="4" stroke-dasharray="25,8" filter="url(#shadow)"/>
  <!-- Nuclear pores (5) -->
  <circle cx="140" cy="270" r="7" fill="#dc2626"/>
  <circle cx="280" cy="150" r="7" fill="#dc2626"/>
  <circle cx="420" cy="270" r="7" fill="#dc2626"/>
  <circle cx="280" cy="390" r="7" fill="#dc2626"/>
  <circle cx="380" cy="350" r="7" fill="#dc2626"/>

  <!-- Chromatin / ADN Inside Nucleus -->
  <path d="M 210 240 Q 240 200, 270 240 T 330 240 Q 360 280, 310 310 T 230 290 Z" fill="none" stroke="#b45309" stroke-width="3"/>
  <path d="M 220 250 Q 250 210, 280 250 T 340 250" fill="none" stroke="#d97706" stroke-width="2"/>
  <text x="280" y="275" fill="#78350f" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui">ADN نووي (المعلومة الوراثية)</text>

  <!-- mRNA exiting pore (6) -->
  <path d="M 330 280 C 370 290, 415 275, 435 265 C 470 250, 490 280, 520 260" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <!-- Nucleotides marks on mRNA -->
  <line x1="440" y1="262" x2="440" y2="270" stroke="#ef4444" stroke-width="2"/>
  <line x1="460" y1="254" x2="460" y2="262" stroke="#ef4444" stroke-width="2"/>
  <line x1="480" y1="257" x2="480" y2="265" stroke="#ef4444" stroke-width="2"/>
  <line x1="500" y1="270" x2="500" y2="278" stroke="#ef4444" stroke-width="2"/>

  <!-- Rough Endoplasmic Reticulum (RER) Cisternae (2) -->
  <g stroke="#4f46e5" stroke-width="3.5" fill="url(#rerGrad)" filter="url(#shadow)">
    <path d="M 520 180 C 580 170, 680 190, 720 220 C 700 240, 600 210, 530 220 Z"/>
    <path d="M 500 240 C 590 230, 690 250, 730 290 C 710 310, 610 270, 510 280 Z"/>
    <path d="M 510 300 C 600 290, 700 320, 740 360 C 710 380, 610 340, 520 340 Z"/>
    <path d="M 530 360 C 610 350, 690 390, 710 420 C 680 435, 610 400, 540 395 Z"/>
  </g>

  <!-- Ribosomes attached (3) & Free Ribosomes -->
  <g fill="#4338ca">
    <!-- Attached to RER -->
    <circle cx="550" cy="182" r="4"/><circle cx="590" cy="180" r="4"/><circle cx="630" cy="188" r="4"/><circle cx="670" cy="202" r="4"/>
    <circle cx="540" cy="242" r="4"/><circle cx="580" cy="238" r="4"/><circle cx="630" cy="248" r="4"/><circle cx="680" cy="265" r="4"/>
    <circle cx="530" cy="302" r="4"/><circle cx="580" cy="300" r="4"/><circle cx="640" cy="315" r="4"/><circle cx="690" cy="335" r="4"/>
    <!-- Free Polyribosomes in cytoplasm -->
    <circle cx="470" cy="380" r="4.5"/><circle cx="482" cy="383" r="4.5"/><circle cx="494" cy="381" r="4.5"/><circle cx="506" cy="384" r="4.5"/>
    <circle cx="760" cy="210" r="4"/><circle cx="772" cy="214" r="4"/><circle cx="784" cy="212" r="4"/>
  </g>

  <!-- Growing polypeptide chains from ribosomes -->
  <path d="M 580 242 Q 585 255, 595 260" fill="none" stroke="#10b981" stroke-width="2.5"/>
  <path d="M 630 248 Q 635 262, 642 268" fill="none" stroke="#10b981" stroke-width="2.5"/>
  <path d="M 580 300 Q 585 315, 595 320" fill="none" stroke="#10b981" stroke-width="2.5"/>

  <!-- ================= LABELS & POINTERS ================= -->
  <!-- 1: Plasma Membrane -->
  <line x1="820" y1="120" x2="780" y2="135" stroke="#059669" stroke-width="2"/>
  <circle cx="820" cy="115" r="14" fill="#059669"/>
  <text x="820" y="120" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">1</text>
  <text x="800" y="98" fill="#065f46" font-size="12" font-weight="bold">1. غشاء هيولي</text>

  <!-- 2: RER -->
  <line x1="770" y1="310" x2="680" y2="280" stroke="#4338ca" stroke-width="2"/>
  <circle cx="790" cy="315" r="14" fill="#4338ca"/>
  <text x="790" y="320" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">2</text>
  <text x="790" y="342" fill="#312e81" font-size="12" font-weight="bold">2. شبكة هيولية محببة (REG)</text>

  <!-- 3: Ribosomes -->
  <line x1="610" y1="145" x2="590" y2="175" stroke="#4338ca" stroke-width="2"/>
  <circle cx="615" cy="135" r="14" fill="#4338ca"/>
  <text x="615" y="140" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">3</text>
  <text x="600" y="115" fill="#312e81" font-size="12" font-weight="bold">3. ريبوزومات</text>

  <!-- 4: Nucleus -->
  <line x1="170" y1="180" x2="220" y2="220" stroke="#d97706" stroke-width="2"/>
  <circle cx="160" cy="170" r="14" fill="#d97706"/>
  <text x="160" y="175" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">4</text>
  <text x="150" y="150" fill="#92400e" font-size="12" font-weight="bold">4. نواة الخلية (ADN)</text>

  <!-- 5: Nuclear Pore -->
  <line x1="410" y1="190" x2="420" y2="265" stroke="#dc2626" stroke-width="2"/>
  <circle cx="410" cy="180" r="14" fill="#dc2626"/>
  <text x="410" y="185" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">5</text>
  <text x="400" y="160" fill="#991b1b" font-size="12" font-weight="bold">5. ثقب نووي</text>

  <!-- 6: mRNA -->
  <line x1="470" y1="215" x2="480" y2="255" stroke="#ef4444" stroke-width="2"/>
  <circle cx="470" cy="205" r="14" fill="#ef4444"/>
  <text x="470" y="210" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">6</text>
  <text x="470" y="185" fill="#b91c1c" font-size="12" font-weight="bold">6. حمض ريبي نووي رسول (ARNm)</text>
</svg>